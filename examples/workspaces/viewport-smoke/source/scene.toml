schema_version = 1
root = "root"

[params.arm_length]
type = "scalar"
value = 2.6

[nodes.body]
kind = "box"
size = { x = 2.2, y = 1.2, z = 1.1 }
transform = { translate = { x = 0.2, y = 0.0, z = 0.0 }, rotate_deg = { x = 0.0, y = 18.0, z = 0.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }

[nodes.arm]
kind = "cylinder"
radius = 0.25
height = { param = "arm_length" }
transform = { translate = { x = -1.6, y = 0.35, z = 0.4 }, rotate_deg = { x = 0.0, y = 0.0, z = 55.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }

[nodes.cap]
kind = "sphere"
radius = 0.55
transform = { translate = { x = 1.35, y = 0.8, z = -0.55 }, rotate_deg = { x = 0.0, y = 0.0, z = 0.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }

[nodes.cutout]
kind = "box"
size = { x = 0.75, y = 1.3, z = 0.5 }
transform = { translate = { x = 0.55, y = 0.15, z = 0.25 }, rotate_deg = { x = 0.0, y = 22.0, z = 0.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }

[nodes.union_shape]
kind = "union"
children = ["body", "arm", "cap"]
transform = { translate = { x = 0.0, y = 0.0, z = 0.0 }, rotate_deg = { x = 0.0, y = 0.0, z = 0.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }

[nodes.root]
kind = "difference"
children = ["union_shape", "cutout"]
transform = { translate = { x = 0.0, y = 0.0, z = 0.0 }, rotate_deg = { x = 0.0, y = 0.0, z = 0.0 }, scale = { x = 1.0, y = 1.0, z = 1.0 } }
